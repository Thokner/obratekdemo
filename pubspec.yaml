name: obratek_app
description: Obratek - aplicación Flutter para web, Android e iOS
publish_to: none
version: 0.0.4+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/obratek_marca.png
    - assets/brand/obratek_marca_oscura.png
    - assets/brand/logo_original.png
